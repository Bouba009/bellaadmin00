<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bella Skills HUB | Executive Admin Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root{
    --purple:#7525B5;
    --purple-dark:#42105F;
    --purple-light:#B97AE8;
    --purple-soft:#F5EFFC;
    --bg:#F4F2F7;
    --surface:#FFFFFF;
    --border:#E5E0EB;
    --text:#241A2B;
    --muted:#7A7482;
    --success:#27AE60;
    --warning:#E67E22;
    --danger:#C0392B;
    --shadow:0 12px 35px rgba(66,16,95,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"DM Sans",sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
}

/* =========================================================
   LOGIN SCREEN OVERLAY (FIREBASE AUTH)
========================================================= */
#loginGate{
    position:fixed;
    inset:0;
    z-index:99999;
    background:linear-gradient(135deg, #1f0d2c 0%, #42105F 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-card{
    background:white;
    width:min(440px, 100%);
    padding:40px 32px;
    border-radius:24px;
    box-shadow:0 25px 70px rgba(0,0,0,.35);
    text-align:center;
}

.login-card img{
    width:64px;
    height:64px;
    border-radius:14px;
    margin-bottom:16px;
    object-fit:cover;
}

.login-card h2{
    font-size:22px;
    color:var(--purple-dark);
    margin-bottom:6px;
    font-weight:800;
}

.login-card p{
    color:var(--muted);
    font-size:13px;
    margin-bottom:24px;
}

/* =========================================================
   LAYOUT (SIDEBAR + MAIN CONTENT)
========================================================= */
.sidebar{
    width:270px;
    background:var(--purple-dark);
    color:white;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    position:sticky;
    top:0;
    height:100vh;
    border-right:1px solid rgba(255,255,255,.08);
    z-index: 100;
}

.sidebar-header{
    padding:26px 22px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.sidebar-header img{
    width:42px;
    height:42px;
    border-radius:10px;
    object-fit:cover;
}

.brand-text{
    font-size:16px;
    font-weight:800;
    letter-spacing:.5px;
    line-height:1.2;
}

.brand-text small{
    display:block;
    color:var(--purple-light);
    font-size:10px;
    letter-spacing:2px;
}

.sidebar-nav{
    padding:20px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex-grow:1;
    overflow-y:auto;
}

.nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    color:rgba(255,255,255,.75);
    font-size:13.5px;
    font-weight:600;
    border-radius:12px;
    cursor:pointer;
    border:none;
    background:none;
    width:100%;
    text-align:left;
    transition:.2s ease;
}

.nav-item:hover{
    background:rgba(255,255,255,.08);
    color:white;
}

.nav-item.active{
    background:var(--purple);
    color:white;
    box-shadow:0 6px 20px rgba(117,37,181,.35);
}

.badge-count{
    margin-left:auto;
    background:var(--danger);
    color:white;
    font-size:10px;
    font-weight:800;
    padding:2px 8px;
    border-radius:12px;
}

.sidebar-footer{
    padding:20px 16px;
    border-top:1px solid rgba(255,255,255,.08);
}

.user-info-tag{
    display:block;
    font-size:11px;
    color:rgba(255,255,255,0.6);
    margin-bottom:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:center;
}

.logout-btn{
    width:100%;
    background:rgba(192,57,43,.15);
    color:#FF8585;
    border:1px solid rgba(192,57,43,.3);
    padding:10px;
    border-radius:10px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.logout-btn:hover{
    background:#C0392B;
    color:white;
}

/* MAIN CONTENT */
.main{
    flex-grow:1;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow-y:auto;
}

.topbar{
    height:75px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 35px;
    position:sticky;
    top:0;
    z-index:50;
}

.topbar h1{
    font-size:20px;
    font-weight:800;
    color:var(--purple-dark);
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:16px;
}

.live-indicator{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    color:var(--success);
    background:#E8F8F0;
    padding:6px 14px;
    border-radius:20px;
}

.live-indicator span{
    width:8px;
    height:8px;
    background:var(--success);
    border-radius:50%;
    box-shadow:0 0 10px var(--success);
    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    0% { transform:scale(1); opacity:1; }
    50% { transform:scale(1.4); opacity:.5; }
    100% { transform:scale(1); opacity:1; }
}

.content{
    padding:32px 35px;
    flex-grow:1;
}

/* =========================================================
   3D GRADIENT CARDS SYSTEM (MODERN VECTOR ICONS)
========================================================= */
.stats-grid-3d{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:22px;
    margin-bottom:35px;
    perspective: 1000px;
}

.card-3d{
    border-radius:20px;
    padding:24px 22px;
    color:white;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 15px 35px rgba(0,0,0,0.12), 0 5px 15px rgba(0,0,0,0.06);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height: 140px;
}

.card-3d:hover{
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 22px 45px rgba(0,0,0,0.2), 0 8px 20px rgba(0,0,0,0.12);
}

.card-3d::after{
    content:'';
    position:absolute;
    top:0;
    right:0;
    bottom:0;
    left:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 65%);
    pointer-events:none;
}

.card-3d .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:2;
}

.card-3d .icon-box{
    width:50px;
    height:50px;
    border-radius:15px;
    background:rgba(255,255,255,0.22);
    backdrop-filter: blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 2px 5px rgba(255,255,255,0.35);
    color:white;
}

.card-3d .icon-box svg{
    stroke-width:2.2;
}

.card-3d .click-hint{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
    opacity:0.85;
}

.card-3d .bottom-row{
    position:relative;
    z-index:2;
    margin-top:16px;
}

.card-3d .stat-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.4px;
    opacity:0.92;
    text-transform:uppercase;
}

.card-3d .stat-value{
    font-size:28px;
    font-weight:800;
    margin-top:4px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.15);
}

/* GRADIENTS */
.card-grad-blue {
    background: linear-gradient(135deg, #1A73E8 0%, #00C6FF 100%);
    box-shadow: 0 14px 30px rgba(26,115,232,0.3);
}
.card-grad-indigo {
    background: linear-gradient(135deg, #4E54C8 0%, #8F94FB 100%);
    box-shadow: 0 14px 30px rgba(78,84,200,0.3);
}
.card-grad-purple {
    background: linear-gradient(135deg, #7F00FF 0%, #E100FF 100%);
    box-shadow: 0 14px 30px rgba(127,0,255,0.3);
}
.card-grad-orange {
    background: linear-gradient(135deg, #FF512F 0%, #F09819 100%);
    box-shadow: 0 14px 30px rgba(255,81,47,0.3);
}
.card-grad-emerald {
    background: linear-gradient(135deg, #11998E 0%, #38EF7D 100%);
    box-shadow: 0 14px 30px rgba(17,153,142,0.3);
}

/* =========================================================
   STANDARD CARDS & TABLES
========================================================= */
.card{
    background:white;
    border-radius:18px;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:26px;
    margin-bottom:28px;
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.card-header h3{
    font-size:18px;
    color:var(--purple-dark);
}

.btn{
    padding:10px 20px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    border:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:.25s;
}

.btn-primary{
    background:var(--purple);
    color:white;
}

.btn-primary:hover{
    background:var(--purple-dark);
}

.btn-sm{
    padding:6px 12px;
    font-size:11.5px;
    border-radius:6px;
}

.btn-success{ background:#27AE60; color:white; }
.btn-warning{ background:#F39C12; color:white; }
.btn-danger{ background:#C0392B; color:white; }
.btn-outline{ background:transparent; border:1px solid #DDD; color:#444; }

.table-responsive{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    text-align:left;
    font-size:13.5px;
}

th{
    background:#FAF9FB;
    color:var(--muted);
    font-weight:700;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
}

td{
    padding:14px 16px;
    border-bottom:1px solid #F1EDF5;
    vertical-align:middle;
}

tr:hover td{
    background:#FDFBFE;
}

.status-tag{
    display:inline-block;
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

.status-valide{ background:#D4EDDA; color:#155724; }
.status-en_attente{ background:#FFF3CD; color:#856404; }
.status-refuse{ background:#F8D7DA; color:#721C24; }

/* FORMS & MODALS */
.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--purple-dark);
    margin-bottom:6px;
}

.form-group input, 
.form-group textarea, 
.form-group select{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    outline:none;
}

.form-group input:focus, 
.form-group textarea:focus{
    border-color:var(--purple);
}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,10,28,.65);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9000;
    padding:20px;
}

.modal-overlay.active{ display:flex; }

.modal-box{
    background:white;
    width:min(580px, 100%);
    max-height:90vh;
    overflow-y:auto;
    border-radius:20px;
    padding:30px;
    position:relative;
}

.modal-close{
    position:absolute;
    top:18px;
    right:18px;
    background:#eee;
    border:none;
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
}

/* TOASTS */
.toast-wrap{
    position:fixed;
    top:20px;
    right:20px;
    z-index:999999;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.toast{
    background:white;
    padding:12px 20px;
    border-radius:10px;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
    border-left:4px solid var(--purple);
}

@media(max-width:900px){
    body{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; }
    .topbar{ padding:0 20px; }
    .content{ padding:20px; }
    .grid-2{ grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- TOAST CONTAINER -->
<div id="toastWrap" class="toast-wrap"></div>

<!-- =========================================================
     1. LOGIN GATE (SECURE FIREBASE AUTHENTICATION)
========================================================= -->
<div id="loginGate">
    <div class="login-card">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEimZMGp5BR7hQp2daYfz6ii_IJ4wWEWk347tsUnOn42aD1hNGww9MAb17n3m9Qiwxc4-iyCYhjuPI-kQHJKLCZ2YrplFnSh5YGWTlpZ90DxQUjtwszIJXTtWRJdhz56qv3eh3QLGehQCUcZibgMvmg0UyXd0ewj3C-PY0xg_WTvoqTMcNFRRWsJ2fnTOYY/s320/1000013350.png" alt="Bella Skills">
        <h2>Administration HUB</h2>
        <p>Connexion sécurisée via compte Firebase</p>
        <form id="adminLoginForm" onsubmit="event.preventDefault(); window.loginWithFirebaseAuth();">
            <div class="form-group" style="text-align:left;">
                <label>Email Administrateur</label>
                <input type="email" id="adminEmailInput" placeholder="bellaskills@email.com" required autofocus>
            </div>
            <div class="form-group" style="text-align:left;">
                <label>Mot de passe</label>
                <input type="password" id="adminPasswordInput" placeholder="••••••••" required>
            </div>
            <button type="submit" id="adminLoginSubmitBtn" class="btn btn-primary" style="width:100%;padding:12px;justify-content:center;">
                Se connecter
            </button>
        </form>
    </div>
</div>

<!-- =========================================================
     2. SIDEBAR
========================================================= -->
<aside class="sidebar">
    <div class="sidebar-header">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEimZMGp5BR7hQp2daYfz6ii_IJ4wWEWk347tsUnOn42aD1hNGww9MAb17n3m9Qiwxc4-iyCYhjuPI-kQHJKLCZ2YrplFnSh5YGWTlpZ90DxQUjtwszIJXTtWRJdhz56qv3eh3QLGehQCUcZibgMvmg0UyXd0ewj3C-PY0xg_WTvoqTMcNFRRWsJ2fnTOYY/s320/1000013350.png" alt="Logo">
        <div class="brand-text">
            BELLA SKILLS
            <small>CONTROL PANEL</small>
        </div>
    </div>

    <nav class="sidebar-nav">
        <button class="nav-item active" id="nav_dashboard" onclick="switchTab('dashboard')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Vue d'ensemble
        </button>

        <button class="nav-item" id="nav_orders" onclick="switchTab('orders')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            Commandes & Paiements
            <span class="badge-count" id="pendingOrdersBadge" style="display:none;">0</span>
        </button>

        <button class="nav-item" id="nav_courses" onclick="switchTab('courses')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
            Formations & E-Learning
        </button>

        <button class="nav-item" id="nav_onsite" onclick="switchTab('onsite')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 7v14M21 7v14M6 11h12M6 15h12M9 3l3 4 3-4"></path></svg>
            Inscriptions Présentiel
            <span class="badge-count" id="onsiteBadge" style="display:none;background:#F39C12;">0</span>
        </button>

        <button class="nav-item" id="nav_users" onclick="switchTab('users')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Étudiants & Comptes
        </button>

        <button class="nav-item" id="nav_messages" onclick="switchTab('messages')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            Demandes de Contact & Devis
            <span class="badge-count" id="inboxBadge" style="display:none;background:var(--purple-light);">0</span>
        </button>

        <button class="nav-item" id="nav_settings" onclick="switchTab('settings')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Paramètres & Coordonnées
        </button>
    </nav>

    <div class="sidebar-footer">
        <span class="user-info-tag" id="sidebarUserEmail">Administrateur</span>
        <button class="logout-btn" onclick="window.logoutAdmin()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Déconnexion Firebase
        </button>
    </div>
</aside>

<!-- =========================================================
     3. MAIN VIEW
========================================================= -->
<main class="main">
    <header class="topbar">
        <h1 id="topbarTitle">Vue d'ensemble</h1>
        <div class="topbar-right">
            <div class="live-indicator">
                <span></span> Firebase Connecté
            </div>
        </div>
    </header>

    <div class="content">

        <!-- 3D STATS CARDS -->
        <div class="stats-grid-3d">
            <div class="card-3d card-grad-blue" onclick="switchTab('dashboard')">
                <div class="top-row">
                    <div class="icon-box">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </div>
                    <span class="click-hint">Aujourd'hui ➔</span>
                </div>
                <div class="bottom-row">
                    <div class="stat-title">Visites du Jour</div>
                    <div class="stat-value" id="statDailyVisits">0</div>
                </div>
            </div>

            <div class="card-3d card-grad-indigo" onclick="switchTab('dashboard')">
